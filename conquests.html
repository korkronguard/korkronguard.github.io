<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hall of Conquest · Kor'kron Guard</title>
<meta name="description" content="The Kor'kron Guard's first clears: a picture from the first time the Guard brought down each dungeon and raid together.">
<link rel="icon" href="assets/crest.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/nav.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<main>
  <header class="page-head wrap">
    <p class="eyebrow">Trophies of the Guard</p>
    <h1>Hall of Conquest</h1>
    <div class="rule">&#9670;</div>
    <p class="section-sub">The first time the Guard brings down a dungeon or a raid together, the moment is set down here.</p>
  </header>

  <section class="section" style="padding-top:30px">
    <div class="wrap">
      <h2 class="section-title">Raids</h2>
      <div class="rule">&#9670;</div>
      <div class="trophies" id="raids"></div>

      <h2 class="section-title" style="margin-top:80px">Dungeons</h2>
      <div class="rule">&#9670;</div>
      <div class="trophies" id="dungeons"></div>
    </div>
  </section>
</main>

<script src="data/players.js"></script>
<script src="data/conquests.js"></script>
<script src="assets/site.js"></script>
<script src="assets/nav.js" data-root="" data-page="conquests"></script>
<script>
  // A party member whose character has a record on the site links to it.
  function partyMember(name) {
    var m = (window.KG_PLAYERS || []).filter(function (p) { return p.name === name && KG.hasRecord(p); })[0];
    if (!m) return "<li>" + KG.esc(name) + "</li>";
    return '<li><a href="' + KG.recordHref(m, "") + '" style="color:' + KG.classColor(m) + '">' + KG.esc(name) + "</a></li>";
  }

  function trophy(c) {
    var d = c.date.split("-");
    var day = new Date(+d[0], d[1] - 1, +d[2]).toLocaleDateString([], { year: "numeric", month: "long", day: "numeric" });
    var src = "assets/conquests/" + KG.esc(c.image);
    return '<figure class="trophy panel">' +
      '<a class="trophy-pic" href="' + src + '" target="_blank" rel="noopener" title="Open the full picture">' +
        '<img src="' + src + '" alt="' + KG.esc("The Kor'kron Guard after their first " + c.place + " clear") + '" loading="lazy"></a>' +
      "<figcaption>" +
        '<p class="trophy-kind">First Clear · ' + (c.kind === "raid" ? "Raid" : "Dungeon") + "</p>" +
        "<h3>" + KG.esc(c.place) + "</h3>" +
        '<p class="trophy-date">' + day + "</p>" +
        (c.note ? '<p class="trophy-note">' + KG.esc(c.note) + "</p>" : "") +
        (c.party && c.party.length ? '<ul class="trophy-party">' + c.party.map(partyMember).join("") + "</ul>" : "") +
      "</figcaption></figure>";
  }

  function render(el, kind, emptyText) {
    var list = (window.KG_CONQUESTS || []).filter(function (c) { return c.kind === kind; })
      .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    el.innerHTML = list.length ? list.map(trophy).join("") : '<p class="empty panel">' + emptyText + "</p>";
  }

  render(document.getElementById("raids"), "raid", "No raid has fallen to the Guard yet. The Vanguard's first raid clears will hang here.");
  render(document.getElementById("dungeons"), "dungeon", "No dungeon clears set down yet.");
</script>
</body>
</html>
